<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exames</title>

    <!-- Nosso arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container central do nosso App -->
    <div class="app-container">

        <!-- Cabeçalho -->
        <header>
            <h1>Exames</h1>
        </header>

        <!-- Sumário: mostra a quantidade de exames realizados -->
        <section class="summary-card">
            <span>Realizados</span>
            <strong id="counter-text">0/0</strong>
        </section>

        <!-- Formulário para adicionar ou editar um exame -->
        <section class="input-area">
            <label id="form-label">Cadastrar exame</label>
            <form id="exame-form">
                <input type="text" id="paciente-input" placeholder="Paciente" maxlength="100" required>
                <input type="text" id="tipo-input" placeholder="Tipo de exame" maxlength="100" required>
                <select id="status-input">
                    <option value="Pendente">Pendente</option>
                    <option value="Realizado">Realizado</option>
                </select>
                <div class="form-buttons">
                    <button type="submit" id="submit-btn">Salvar</button>
                    <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Lista de exames: será preenchida pelo Javascript -->
        <ul class="exame-list" id="exame-list"></ul>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
